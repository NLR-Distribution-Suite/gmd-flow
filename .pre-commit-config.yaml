repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff
        args: [src/]
        pass_filenames: false
      - id: ruff-format
        args: [--check, src/]
        pass_filenames: false

  - repo: local
    hooks:
      - id: coverage
        name: coverage (90% minimum)
        entry: pytest --cov=gdm_flow --cov-fail-under=90 --cov-report=term-missing -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
